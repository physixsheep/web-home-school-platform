server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: home-school-platform
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/home_school_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

app:
  jwt:
    issuer: home-school-platform
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    secret: ${JWT_SECRET:ZGV2LW9ubHktY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tY29kZXgtc2VjcmV0LTIwMjY=}
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  storage:
    root: ${UPLOAD_ROOT:./storage}
    max-size-bytes: 20971520
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
      - webp
      - pdf
      - doc
      - docx
      - xls
      - xlsx
      - ppt
      - pptx
      - txt

logging:
  level:
    root: INFO
    com.homeschool.platform: INFO
    org.springframework.security: WARN

